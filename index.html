<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zahran's Attire - Direct Website Launcher</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background: #09090b;
      color: #f4f4f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 16px;
      max-width: 580px;
      width: 100%;
      padding: 36px 30px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      text-align: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #27272a;
      color: #a1a1aa;
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 16px;
    }
    .badge-pulse {
      width: 8px;
      height: 8px;
      background: #22c55e;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }
    h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
      color: #ffffff;
    }
    .subtitle {
      color: #a1a1aa;
      font-size: 14px;
      margin-bottom: 28px;
    }
    .btn-main {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #ffffff;
      color: #09090b;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
      padding: 14px 24px;
      border-radius: 10px;
      transition: all 0.2s ease;
      margin-bottom: 14px;
    }
    .btn-main:hover {
      background: #e4e4e7;
      transform: translateY(-2px);
    }
    .grid-links {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 8px;
    }
    .btn-secondary {
      display: block;
      background: #27272a;
      color: #f4f4f5;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      padding: 12px 14px;
      border-radius: 8px;
      transition: background 0.2s;
    }
    .btn-secondary:hover {
      background: #3f3f46;
    }
    .info-box {
      margin-top: 24px;
      padding: 14px;
      background: #121215;
      border-radius: 8px;
      border: 1px dashed #3f3f46;
      font-size: 12px;
      color: #71717a;
      line-height: 1.6;
    }
    .countdown {
      color: #38bdf8;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="badge">
      <span class="badge-pulse"></span>
      Website Launcher
    </div>

    <h1>Zahran's Attire</h1>
    <p class="subtitle">প্রিমিয়াম ফ্যাশন ও ক্লদিং স্টোর</p>

    <!-- Main Direct Link -->
    <a href="http://localhost:3000" class="btn-main" id="launchBtn">
      <span>🚀</span>
      <span>ওয়েবসাইট ওপেন করুন</span>
    </a>

    <!-- Navigation Links -->
    <div class="grid-links">
      <a href="http://localhost:3000/admin" class="btn-secondary">⚙️ অ্যাডমিন প্যানেল</a>
      <a href="http://localhost:3000/admin/products" class="btn-secondary">📦 প্রোডাক্ট ম্যানেজমেন্ট</a>
      <a href="http://localhost:3000/cart" class="btn-secondary">🛒 শপিং কার্ট</a>
      <a href="http://localhost:3000/api/seed" class="btn-secondary">🌱 Firebase সিড ডেটা</a>
    </div>

    <div class="info-box">
      <p id="redirectText"><span class="countdown" id="count">3</span> সেকেন্ডের মধ্যে সরাসরি ওয়েবসাইটে রিডাইরেক্ট হচ্ছে...</p>
      <p style="margin-top: 6px; color: #a1a1aa;">যদি সার্ভার বন্ধ থাকে, ফোল্ডারে থাকা <b>Run_Server.bat</b> ফাইলটি রান করুন।</p>
    </div>
  </div>

  <script>
    let timeLeft = 3;
    const countEl = document.getElementById("count");
    const redirectText = document.getElementById("redirectText");

    const timer = setInterval(() => {
      timeLeft--;
      if (countEl) countEl.innerText = timeLeft;
      if (timeLeft <= 0) {
        clearInterval(timer);
        window.location.href = "http://localhost:3000";
      }
    }, 1000);

    // Stop auto-redirect if user interacts
    document.addEventListener("click", () => {
      clearInterval(timer);
      if (redirectText) {
        redirectText.innerText = "অটো-রিডাইরেক্ট থামানো হয়েছে। যেকোনো বাটনে ক্লিক করে পেজ ওপেন করুন।";
      }
    });
  </script>

</body>
</html>
